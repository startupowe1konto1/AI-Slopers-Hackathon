[project]
name = "pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pandas>=2.2",
    "pytest>=8",
    "requests>=2.32",
    "rasterio>=1.4",
]

[tool.pytest.ini_options]
# Każdy moduł ma swój pipeline/<moduł>/test_build.py; bez importlib pytest myli pliki o tej samej nazwie.
addopts = "--import-mode=importlib"
pythonpath = ["."]
