name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --passWithNoTests
      - run: npm run build
      - uses: astral-sh/setup-uv@v5
      - name: Walidacja paczki danych
        run: if [ -f pipeline/validate.py ]; then uv run --project pipeline pipeline/validate.py; else echo "brak pipeline/validate.py"; fi
